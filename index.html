<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>フットサル作戦ボード</title>
<style>
:root{
  --bg:#f3f4f1;--surface:#ffffff;--text:#1d1f1c;--sub:#5f625c;--border:#d3d6cf;
  --accent:#185FA5;--accent-bg:#E6F1FB;--on-accent:#ffffff;--danger:#A32D2D;--on-danger:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141513;--surface:#1f211e;--text:#eceee9;--sub:#a3a69f;--border:#3a3d37;
    --accent:#85B7EB;--accent-bg:#0C2C4C;--on-accent:#0b1a2a;--danger:#F09595;--on-danger:#2a0b0b;
  }
}
:root[data-theme="dark"]{
  --bg:#141513;--surface:#1f211e;--text:#eceee9;--sub:#a3a69f;--border:#3a3d37;
  --accent:#85B7EB;--accent-bg:#0C2C4C;--on-accent:#0b1a2a;--danger:#F09595;--on-danger:#2a0b0b;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{--chrome:309px}
body.sub{--chrome:355px}
body.view{--chrome:212px}
.app{max-width:480px;margin:0 auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;min-height:100dvh}
.row{display:flex;gap:6px;align-items:center}
.grow{flex:1;min-width:0}
button{font:inherit;font-size:14px;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:0 10px;height:38px;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap}
button:active{transform:scale(.97)}
button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
input[type=text]{font:inherit;font-size:16px;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:8px;height:38px;padding:0 10px;width:100%}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px}
body.view #name{border-color:transparent;background:transparent;font-weight:600;padding:0 2px}
body.view #name:focus{outline:none}
body.view .edit-only{display:none !important}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.modes button{padding:0 2px;font-size:12px;flex-direction:column;gap:2px;height:42px}
.court-wrap{display:flex;justify-content:center}
#court{--ar:0.532;width:min(100%,calc((100dvh - var(--chrome)) * var(--ar)));min-width:200px;aspect-ratio:23/43.2;
  display:block;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px}
#court.half{--ar:1.018;aspect-ratio:23/22.6}
#court .arrow-hit{pointer-events:none}
#court.draw .arrow-hit{pointer-events:stroke}
#court.draw .piece{pointer-events:none}
#court.move .piece{cursor:grab}
#court.draw{cursor:crosshair}
#court .bubbles,#court .blocks{pointer-events:none}
#court.bubble .bubbles{pointer-events:auto}
#court.bubble .piece{pointer-events:none}
#court.bubble{cursor:pointer}
#court.blockmode .blocks{pointer-events:auto}
#court.blockmode .piece{pointer-events:none}
#court.blockmode{cursor:pointer}
.frames{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 1px}
.frames::-webkit-scrollbar{display:none}
.frames button{flex:0 0 auto;height:34px;font-size:13px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.frames button.lift{transform:scale(1.08);border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet[hidden]{display:none}
.sheet-body{background:var(--bg);width:100%;max-width:480px;max-height:80dvh;overflow:auto;
  border-radius:16px 16px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;font-weight:600;margin:0}
.opt-label{font-size:13px;color:var(--sub);margin:14px 0 6px}
.opt-hint{font-size:12px;color:var(--sub);margin-top:6px}
.wide{width:100%}
.item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px}
.item .name{font-size:15px;font-weight:600;word-break:break-all;flex:1;min-width:0}
.item .head{display:flex;gap:8px;align-items:flex-start}
.item button.handle{width:40px;height:34px;padding:0;font-size:18px;color:var(--sub);touch-action:none;cursor:grab;flex:0 0 auto}
.folder{margin-top:10px}
.folder-head{display:flex;gap:6px;align-items:center}
.folder-head .toggle{flex:1;min-width:0;justify-content:flex-start;font-weight:600;font-size:15px;
  background:transparent;border-color:transparent;padding:0 4px;overflow:hidden;text-overflow:ellipsis}
.folder-head .count{color:var(--sub);font-weight:400}
.folder-head .more{width:40px;padding:0}
.folder-body{margin-left:8px;padding-left:8px;border-left:2px solid var(--border)}
.folder-body .empty{padding:8px 4px}
.item.lift{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.22);position:relative;z-index:1}
.item .meta{font-size:12px;color:var(--sub);margin:2px 0 8px}
.item button{height:34px;font-size:13px}
.empty{color:var(--sub);font-size:14px;padding:16px 4px}
.danger{color:var(--danger)}
button.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.dlg[hidden]{display:none}
.dlg-body{background:var(--bg);width:100%;max-width:360px;border-radius:14px;padding:16px}
.dlg-body p{margin:0 0 14px;font-size:15px;line-height:1.6;word-break:break-all}
.dlg-body input{margin-bottom:14px}
#dlgLink{font-size:14px}
.dlg-err{color:var(--danger);font-size:13px;margin:-8px 0 12px}
.choices{display:grid;gap:8px;margin-bottom:12px}
.choices button{height:42px}
#toast{position:fixed;left:50%;top:calc(100px + env(safe-area-inset-top));transform:translateX(-50%);
  background:#2c2c2a;color:#fff;font-size:14px;padding:9px 14px;border-radius:8px;
  max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="row">
    <input type="text" id="name" class="grow" maxlength="60" aria-label="作戦名">
    <button id="bundleBtn" hidden>作戦一覧</button>
    <button id="viewBtn">表示</button>
    <button id="listBtn" class="edit-only">一覧</button>
    <button id="saveBtn" class="edit-only">保存</button>
  </div>

  <div class="modes edit-only" id="modes">
    <button data-tool="move" class="on">移動</button>
    <button data-tool="arrow"><svg width="18" height="8" aria-hidden="true"><path d="M1 4H12" stroke="currentColor" stroke-width="2"/><path d="M11 0L17 4L11 8Z" fill="currentColor"/></svg>矢印</button>
    <button data-tool="bubble"><svg width="18" height="10" aria-hidden="true"><path d="M2 1H16Q17 1 17 2V6Q17 7 16 7H8L4 10V7H2Q1 7 1 6V2Q1 1 2 1Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>吹き出し</button>
    <button data-tool="block"><svg width="22" height="8" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="7" rx="2" fill="#C62828"/></svg>ブロック</button>
  </div>
  <div class="modes edit-only" id="arrowTypes" hidden>
    <button data-type="pass" class="on"><svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="#D99A00" stroke-width="2" stroke-dasharray="4 3"/></svg>パス</button>
    <button data-type="drib"><svg width="18" height="8" aria-hidden="true"><path d="M1 4q2-3 4 0t4 0 4 0 4 0" fill="none" stroke="#D85A30" stroke-width="2"/></svg>ドリブル</button>
    <button data-type="run"><svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="currentColor" stroke-width="2"/></svg>動き</button>
    <button data-type="shot"><svg width="18" height="8" aria-hidden="true"><path d="M1 4H12" stroke="#E53935" stroke-width="3"/><path d="M11 0L17 4L11 8Z" fill="#E53935"/></svg>シュート</button>
  </div>

  <div class="court-wrap">
    <svg id="court" class="move" viewBox="-1.5 -1.6 23 43.2" role="img" aria-label="フットサルコート">
      <rect x="-1.5" y="-1.6" width="23" height="43.2" fill="#167F5C"/>
      <rect x="0" y="0" width="20" height="40" fill="#1D9E75"/>
      <g fill="none" stroke="#E8F7F0" stroke-width="0.12">
        <rect x="0" y="0" width="20" height="40"/>
        <line x1="0" y1="20" x2="20" y2="20"/>
        <circle cx="10" cy="20" r="3"/>
        <path d="M2.5 0A6 6 0 0 0 8.5 6L11.5 6A6 6 0 0 0 17.5 0"/>
        <path d="M2.5 40A6 6 0 0 1 8.5 34L11.5 34A6 6 0 0 1 17.5 40"/>
        <path d="M8.5 0V-1H11.5V0"/>
        <path d="M8.5 40V41H11.5V40"/>
      </g>
      <g fill="#E8F7F0">
        <circle cx="10" cy="20" r="0.15"/>
        <circle cx="10" cy="6" r="0.12"/><circle cx="10" cy="10" r="0.12"/>
        <circle cx="10" cy="34" r="0.12"/><circle cx="10" cy="30" r="0.12"/>
      </g>
      <g id="arrows"></g>
      <g id="pieces"></g>
      <g id="blocks" class="blocks"></g>
      <g id="bubbles" class="bubbles"></g>
    </svg>
  </div>

  <input type="text" id="memo" maxlength="200" placeholder="このコマのメモ(例:4番が縦に抜ける)" aria-label="メモ">

  <div class="frames" id="frames"></div>

  <div class="row edit-only">
    <button id="prevBtn" aria-label="コマを前へ移動" title="コマを前へ移動">◀</button>
    <button id="nextBtn" aria-label="コマを後ろへ移動" title="コマを後ろへ移動">▶</button>
    <button id="addBtn" class="grow">＋ コマ追加</button>
    <button id="delBtn" class="danger">削除</button>
  </div>

  <div class="row">
    <button id="playBtn" class="primary grow">▶ 再生</button>
    <button id="speedBtn">普通</button>
    <button id="undoBtn" class="edit-only">↶ 戻す</button>
    <button id="shareBtn" class="edit-only">共有</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-body">
    <div class="row">
      <h2 class="grow" id="sheetTitle">保存した作戦</h2>
      <button id="closeBtn">閉じる</button>
    </div>
    <div class="row edit-only" style="margin-top:10px">
      <button id="newBtn" class="grow">＋ 新しい作戦</button>
      <button id="newFolderBtn" class="grow">＋ フォルダ</button>
      <button id="bundleShareBtn" class="grow">まとめて共有</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<div class="sheet" id="viewSheet" hidden>
  <div class="sheet-body">
    <div class="row">
      <h2 class="grow">表示</h2>
      <button id="viewClose">閉じる</button>
    </div>
    <div class="opt-label">コート</div>
    <div class="row">
      <button id="fullBtn" class="grow">全体コート</button>
      <button id="halfBtn" class="grow">ハーフコート</button>
    </div>
    <div class="opt-label">拡大</div>
    <button id="zoomReset" class="wide">元の大きさに戻す</button>
    <div class="opt-hint">コートを2本指で広げると拡大、つまむと縮小、2本指のまま動かすと表示位置が動きます。</div>
    <div class="opt-label">再生中の「動き」の矢印</div>
    <div class="row">
      <button id="runShow" class="grow">表示</button>
      <button id="runHide" class="grow">非表示</button>
    </div>
  </div>
</div>
<div class="dlg" id="dlg" hidden>
  <div class="dlg-body" role="dialog" aria-modal="true" aria-labelledby="dlgMsg">
    <p id="dlgMsg"></p>
    <input type="text" id="dlgLink" readonly hidden aria-label="共有リンク">
    <input type="text" id="dlgText" maxlength="30" hidden aria-label="吹き出しの文字">
    <div class="dlg-err" id="dlgErr" hidden></div>
    <div class="choices" id="dlgChoices" hidden></div>
    <div class="row">
      <button id="dlgExtra" class="danger" hidden>削除</button>
      <button id="dlgCancel" class="grow">やめる</button>
      <button id="dlgOk" class="grow">OK</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const TYPES = ['pass', 'drib', 'run', 'shot'];
const ARROW = {
  pass: {color: '#FFE08A', dash: '0.7 0.45', w: 0.22, hl: 0.75, hw: 0.42},
  drib: {color: '#FFB4A0', dash: null, w: 0.22, hl: 0.75, hw: 0.42},
  run:  {color: '#FFFFFF', dash: null, w: 0.22, hl: 0.75, hw: 0.42},
  shot: {color: '#FF3B3B', dash: null, w: 0.42, hl: 1.15, hw: 0.75}
};
const PASS_OPEN = '#5BE38A';
const straight = t => t === 'pass' || t === 'shot';
const SPEEDS = [{label: 'ゆっくり', ms: 2000}, {label: '普通', ms: 1200}, {label: '速い', ms: 700}];
const KEY_SAVED = 'futsalBoard.saved';
const KEY_DRAFT = 'futsalBoard.draft';
const KEY_FOLDERS = 'futsalBoard.folders';
const KEY_CLOSED = 'futsalBoard.closedFolders';

// 駒の並び: 0-4 味方(0はGK), 5-9 相手(5はGK), 10 ボール
function defaultPos() {
  return [10,38, 10,31, 4,26, 16,26, 10,22,
          10,2,  10,9,  4,14, 16,14, 10,18,
          10,20.6];
}
const newFrame = p => ({p, a: [], b: [], k: [], m: ''});
function newTactic() {
  return {id: null, name: '新しい作戦', hideRun: false, half: false, frames: [newFrame(defaultPos())]};
}

let T = newTactic();
let cur = 0, mode = 'move', dirty = false, playing = false, speed = 1;
let shareCode = null, viewOnly = false;

const $ = id => document.getElementById(id);
const svg = $('court'), gArrows = $('arrows'), gPieces = $('pieces');
const f2 = v => v.toFixed(2);

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

// ---------- 駒 ----------
const pieceEls = [];
for (let i = 0; i < 11; i++) {
  const g = el('g', {class: 'piece', 'data-i': i}, gPieces);
  if (i < 10) {
    const own = i < 5, gk = i === 0 || i === 5;
    const fill = own ? (gk ? '#0C447C' : '#378ADD') : (gk ? '#993C1D' : '#E8743F');
    const stroke = own ? '#042C53' : '#4A1B0C';
    el('circle', {r: 1.6, fill: 'transparent'}, g);
    el('circle', {r: 0.8, fill, stroke, 'stroke-width': 0.1}, g);
    const t = el('text', {'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': gk ? 0.62 : 0.85, 'font-weight': 'bold', fill: '#fff', 'pointer-events': 'none'}, g);
    t.textContent = gk ? 'GK' : String(i % 5);
  } else {
    el('circle', {r: 1.2, fill: 'transparent'}, g);
    el('circle', {r: 0.45, fill: '#fff', stroke: '#222', 'stroke-width': 0.09}, g);
    el('circle', {r: 0.16, fill: '#222'}, g);
  }
  pieceEls.push(g);
}
function setPos(p) {
  for (let i = 0; i < 11; i++) pieceEls[i].setAttribute('transform', `translate(${f2(p[2*i])},${f2(p[2*i+1])})`);
}

// ---------- 矢印 ----------
const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
function smoothPath(pts) {
  if (pts.length < 3) return `M${f2(pts[0][0])},${f2(pts[0][1])}` + pts.slice(1).map(q => `L${f2(q[0])},${f2(q[1])}`).join('');
  let d = `M${f2(pts[0][0])},${f2(pts[0][1])}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i+1][0]) / 2, my = (pts[i][1] + pts[i+1][1]) / 2;
    d += `Q${f2(pts[i][0])},${f2(pts[i][1])} ${f2(mx)},${f2(my)}`;
  }
  const last = pts[pts.length-1];
  return d + `L${f2(last[0])},${f2(last[1])}`;
}
function wavyPath(pts) {
  const segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = dist(pts[i-1], pts[i]); segs.push(l); total += l; }
  if (total < 0.01) return smoothPath(pts);
  let d = '', seg = 0, segStart = 0;
  for (let s = 0; s <= total + 1e-6; s += 0.12) {
    while (seg < segs.length - 1 && s > segStart + segs[seg]) { segStart += segs[seg]; seg++; }
    const a = pts[seg], b = pts[seg+1], k = segs[seg] ? Math.min(1, (s - segStart) / segs[seg]) : 0;
    const tx = (b[0]-a[0]) / (segs[seg] || 1), ty = (b[1]-a[1]) / (segs[seg] || 1);
    const amp = 0.3 * Math.max(0, Math.min(1, s / 0.5, (total - s) / 0.6));
    const off = amp * Math.sin(2 * Math.PI * s / 1.0);
    const x = a[0] + (b[0]-a[0]) * k - ty * off, y = a[1] + (b[1]-a[1]) * k + tx * off;
    d += (d ? 'L' : 'M') + f2(x) + ',' + f2(y);
  }
  return d;
}
function arrowGeom(a) {
  let pts = straight(a.t) ? [a.pts[0], a.pts[a.pts.length-1]] : a.pts;
  const end = pts[pts.length-1];
  let k = pts.length - 2;
  while (k > 0 && dist(pts[k], end) < 0.6) k--;
  const from = pts[Math.max(k, 0)];
  let dx = end[0] - from[0], dy = end[1] - from[1];
  const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  const {hl, hw} = ARROW[a.t];
  const bx = end[0] - dx*hl, by = end[1] - dy*hl;
  const head = `M${f2(end[0])},${f2(end[1])}L${f2(bx - dy*hw)},${f2(by + dx*hw)}L${f2(bx + dy*hw)},${f2(by - dx*hw)}Z`;
  const linePts = pts.slice(0, -1).concat([[end[0] - dx*hl*0.7, end[1] - dy*hl*0.7]]);
  const d = a.t === 'drib' ? wavyPath(linePts) : smoothPath(linePts);
  return {d, head};
}
function drawArrow(a, parent, k) {
  const g = el('g', {}, parent);
  const {d, head} = arrowGeom(a);
  const st = ARROW[a.t];
  const color = a.t === 'pass' && a.s === 1 ? PASS_OPEN : st.color;
  el('path', {d, fill: 'none', stroke: 'rgba(0,0,0,.28)', 'stroke-width': st.w + 0.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'pointer-events': 'none'}, g);
  const line = el('path', {d, fill: 'none', stroke: color, 'stroke-width': st.w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'pointer-events': 'none'}, g);
  if (st.dash) line.setAttribute('stroke-dasharray', st.dash);
  el('path', {d: head, fill: color, stroke: 'rgba(0,0,0,.28)', 'stroke-width': 0.08, 'pointer-events': 'none'}, g);
  if (a.t === 'pass' && a.s === 2) {
    // パスコースがないときは、線の真ん中に✖を付ける
    const p0 = a.pts[0], p1 = a.pts[a.pts.length-1], mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2, r = 0.55;
    const x = `M${f2(mx-r)},${f2(my-r)}L${f2(mx+r)},${f2(my+r)}M${f2(mx+r)},${f2(my-r)}L${f2(mx-r)},${f2(my+r)}`;
    el('path', {d: x, stroke: '#fff', 'stroke-width': 0.42, 'stroke-linecap': 'round', fill: 'none', 'pointer-events': 'none'}, g);
    el('path', {d: x, stroke: '#E53935', 'stroke-width': 0.24, 'stroke-linecap': 'round', fill: 'none', 'pointer-events': 'none'}, g);
  }
  if (k != null) el('path', {d, class: 'arrow-hit', 'data-k': k, fill: 'none', stroke: 'transparent', 'stroke-width': 1.4}, g);
  return g;
}

// ---------- 矢印に沿った動き ----------
// 再生や自動配置で駒がたどる線(描いた矢印と同じ形)
function movePath(a) {
  const pts = a.pts;
  if (straight(a.t) || pts.length < 3) return [pts[0], pts[pts.length-1]];
  const out = [pts[0]];
  let prev = pts[0];
  for (let i = 1; i < pts.length - 1; i++) {
    const c = pts[i], end = i < pts.length - 2 ? [(pts[i][0] + pts[i+1][0]) / 2, (pts[i][1] + pts[i+1][1]) / 2] : pts[i+1];
    for (let t = 0.25; t <= 1.001; t += 0.25) {
      const u = 1 - t;
      out.push([u*u*prev[0] + 2*u*t*c[0] + t*t*end[0], u*u*prev[1] + 2*u*t*c[1] + t*t*end[1]]);

}
function pointAt(path, k) {
  let total = 0;
  const segs = [];
  for (let i = 1; i < path.length; i++) { const l = dist(path[i-1], path[i]); segs.push(l); total += l; }
  let rest = k * total;
  for (let i = 0; i < segs.length; i++) {
    if (rest <= segs[i] || i === segs.length - 1) {
      const r = segs[i] ? Math.min(1, rest / segs[i]) : 1;
      return [path[i][0] + (path[i+1][0] - path[i][0]) * r, path[i][1] + (path[i+1][1] - path[i][1]) * r];
    }
    rest -= segs[i];
  }

}
// 矢印の描き始めの近くにいる駒を探して、矢印と結びつける
function links(f) {
  const p = f.p, used = new Set(), res = [];
  const near = (from, to, s, maxD) => {
    let best = -1, bd = maxD;
    for (let i = from; i < to; i++) {
      if (used.has(i)) continue;
      const d = Math.hypot(p[2*i] - s[0], p[2*i+1] - s[1]);
      if (d <= bd) { bd = d; best = i; }
    }
    if (best >= 0) used.add(best);
    return best;
  };
  for (const a of f.a) {
    if (a.t === 'pass' && a.s === 2) continue;  // 通らないパスではボールは動かない
    const s = a.pts[0], path = movePath(a);
    if (a.t !== 'run') { const b = near(10, 11, s, 2.5); if (b >= 0) res.push({i: b, path, a}); }
    if (a.t === 'run' || a.t === 'drib') { const q = near(0, 10, s, 2.0); if (q >= 0) res.push({i: q, path, a}); }
  }
  return res;
}
// コマiから次のコマへ(最後のコマは矢印の先へ)、割合kのときの全駒の位置
function framePos(i, k) {
  const a = T.frames[i].p, b = i + 1 < T.frames.length ? T.frames[i+1].p : nextPos(T.frames[i]);
  const out = a.map((v, j) => v + (b[j] - v) * k);
  for (const l of links(T.frames[i])) {
    const P = pointAt(l.path, k), s = l.path[0], e = l.path[l.path.length-1], j = l.i;
    out[2*j]   = P[0] + (a[2*j]   - s[0]) * (1 - k) + (b[2*j]   - e[0]) * k;
    out[2*j+1] = P[1] + (a[2*j+1] - s[1]) * (1 - k) + (b[2*j+1] - e[1]) * k;
  }

}
// 次のコマの配置:矢印と結びついた駒を矢印の先へ置く
function nextPos(f) {
  const p = f.p.slice();
  for (const l of links(f)) {
    const e = l.path[l.path.length-1];
    let x = e[0], y = e[1];
    if (l.i === 10 && l.a.t === 'drib') {
      // ドリブルはボールを選手の少し前に置く
      const q = pointAt(l.path, 0.9), dx = e[0] - q[0], dy = e[1] - q[1], len = Math.hypot(dx, dy) || 1;
      x += dx / len * 1.1; y += dy / len * 1.1;
    }
    p[2*l.i] = clampX(x); p[2*l.i+1] = clampY(y);
  }
  return p;
}

// 画面上の点(fx, fy は要素内の割合)を基準に、幅 w へ拡大・縮小する
function zoomTo(w, ax, ay, fx, fy) {
  const base = baseVB();
  w = Math.max(base.w / 4, Math.min(base.w, w));
  const h = w * base.h / base.w;
  const x = Math.max(base.x, Math.min(base.x + base.w - w, ax - fx * w));
  const y = Math.max(base.y, Math.min(base.y + base.h - h, ay - fy * h));

const pointers = new Map();
let pinch = null, pinchLock = false;
function startPinch() {
  const [a, b] = [...pointers.values()], r = svg.getBoundingClientRect();
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, fx = (mx - r.left) / r.width, fy = (my - r.top) / r.height;
  pinch = {d0: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, w0: vb.w, ax: vb.x + fx * vb.w, ay: vb.y + fy * vb.h};
}
function updatePinch() {
  const [a, b] = [...pointers.values()], r = svg.getBoundingClientRect();

  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;

  zoomTo(vb.w * (e.deltaY > 0 ? 1.12 : 1 / 1.12), vb.x + fx * vb.w, vb.y + fy * vb.h, fx, fy);

const gBubbles = $('bubbles');
const BFS = 1.0, BLH = 1.2;
function wrapText(t) {
  const chars = Array.from(t), lines = [];
  for (let i = 0; i < chars.length; i += 9) lines.push(chars.slice(i, i + 9).join(''));
  return lines.length ? lines : [''];
}
// 文字幅の目安(全角は1文字、半角は約半分)
const textW = line => Array.from(line).reduce((w, c) => w + (c.charCodeAt(0) < 0x2000 ? 0.55 : 1), 0) * BFS;
function bubbleSize(t) {
  const lines = wrapText(t);
  return {lines, w: Math.max(...lines.map(textW)) + 1.0, h: lines.length * BLH * BFS + 0.7};
}
function renderBubbles() {
  gBubbles.textContent = '';
  (T.frames[cur].b || []).forEach((b, k) => {
    const g = el('g', {}, gBubbles);
    const {lines, w, h} = bubbleSize(b.t);
    const x0 = b.bx - w/2, y0 = b.by - h/2;
    // しっぽ:吹き出しの縁からポイントへ
    let tail = null;
    const dx = b.x - b.bx, dy = b.y - b.by;
    if (Math.abs(dx) > w/2 || Math.abs(dy) > h/2) {
      const len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
      const t = Math.min(dx ? (w/2) / Math.abs(dx) : Infinity, dy ? (h/2) / Math.abs(dy) : Infinity);
      const ex = b.bx + dx * t - ux * 0.15, ey = b.by + dy * t - uy * 0.15;
      const hw = Math.min(0.45, w/2 - 0.2);
      tail = `M${f2(ex - uy*hw)},${f2(ey + ux*hw)}L${f2(b.x)},${f2(b.y)}L${f2(ex + uy*hw)},${f2(ey - ux*hw)}Z`;
      el('path', {d: tail, fill: '#fff', stroke: '#222', 'stroke-width': 0.08, 'stroke-linejoin': 'round'}, g);
    }
    el('rect', {x: f2(x0), y: f2(y0), width: f2(w), height: f2(h), rx: 0.35, fill: '#fff', stroke: '#222', 'stroke-width': 0.08, class: 'bubble-box', 'data-k': k}, g);
    if (tail) el('path', {d: tail, fill: '#fff', 'pointer-events': 'none'}, g);
    lines.forEach((line, i) => {
      const t = el('text', {x: f2(b.bx), y: f2(y0 + 0.35 + (i + 0.5) * BLH * BFS), 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-size': BFS, fill: '#1d1f1c', 'pointer-events': 'none'}, g);
      t.textContent = line;
    });
    el('circle', {cx: f2(b.x), cy: f2(b.y), r: 0.28, fill: '#FFE08A', stroke: '#222', 'stroke-width': 0.07, 'pointer-events': 'none'}, g);
    el('circle', {cx: f2(b.x), cy: f2(b.y), r: 1.0, fill: 'transparent', class: 'bubble-pt', 'data-k': k}, g);
  });
}

function svgPt(e) {

  const r = pt.matrixTransform(svg.getScreenCTM().inverse());

const clampX = x => Math.max(-0.8, Math.min(20.8, x));
const clampY = y => Math.max(-1, Math.min(41, y));

function cancelSingle() {
  if (drag) { if (drag.moved) markDirty(); drag = null; }
  if (draw) { if (draw.g) draw.g.remove(); draw = null; }
  if (bdrag) { if (bdrag.moved) markDirty(); bdrag = null; }
  if (kdrag) { if (kdrag.moved) markDirty(); kdrag = null; }
}

  if (playing) stop();
  if (drag || draw || bdrag || kdrag) return;
  const [x, y] = svgPt(e);
  if (mode === 'move') {
    const g = e.target.closest('.piece');
    if (!g) return;
    const i = +g.dataset.i, p = T.frames[cur].p;
    drag = {i, dx: p[2*i] - x, dy: p[2*i+1] - y, id: e.pointerId, moved: false};
    gPieces.appendChild(g);
    if (i !== 10) gPieces.appendChild(pieceEls[10]);
  } else if (mode === 'bubble') {
    const pt = e.target.closest('.bubble-pt'), box = e.target.closest('.bubble-box');
    const k = pt ? +pt.dataset.k : box ? +box.dataset.k : null;
    const b = k != null ? T.frames[cur].b[k] : null;
    bdrag = {k, part: pt ? 'pt' : box ? 'box' : 'new', sx: x, sy: y, o: b ? {...b} : null, id: e.pointerId, moved: false};

let raf = null;
const ease = k => k * k * (3 - 2 * k);

  if (T.frames.length < 2 && !links(T.frames[0]).length) { toast('コマを2つ以上作るか、矢印を描くと再生できます'); return; }
  playing = true;
  $('playBtn').textContent = '❚❚ 停止';
  $('memo').readOnly = true;
  select(cur >= T.frames.length - 1 ? 0 : cur);
  let t0 = performance.now();
  const tick = now => {
    if (!playing) return;
    const D = SPEEDS[speed].ms, H = D * 0.5, el = now - t0;
    const hasNext = cur < T.frames.length - 1;
    // 最後のコマに矢印があれば、矢印の先まで動かして終わる(シュートでボールがゴールへ入るなど)
    const tail = !hasNext && links(T.frames[cur]).length > 0;
    if (el < H) {
      // コマで一旦止める
    } else if ((hasNext || tail) && el < H + D) {
      setPos(framePos(cur, ease((el - H) / D)));
    } else if (hasNext) {
      select(cur + 1);
      t0 = now;
    } else if (tail && el < H + D * 2) {

// ---------- 保存形式 ----------
const r10 = v => Math.round(v * 10);

    const o = {p: f.p.map(r10)};
    // 種類の番号の10の位に、パスコースの状態(1:通る 2:通らない)を入れる
    if (f.a.length) o.a = f.a.map(a => [TYPES.indexOf(a.t) + 10 * (a.s || 0), ...a.pts.flatMap(q => [r10(q[0]), r10(q[1])])]);

    hideRun: o.h === 1,
    half: o.c === 1,
    frames: o.f.slice(0, 200).map(f => {
      const src = Array.isArray(f.p) && f.p.length === 22 ? f.p : def.map(r10);
      const p = src.map((v, i) => i % 2 ? num(v, -1, 41, def[i]) : num(v, -0.8, 20.8, def[i]));

        bx: num(x[2], -1, 21, 10), by: num(x[3], -1.2, 41.2, 20), t: String(x[4]).slice(0, 30)

// ---------- 端末内の保存 ----------

  catch { return []; }
}

  try { localStorage.setItem(KEY_SAVED, JSON.stringify(list)); return true; }

}

  const old = T.id ? readSaved().find(x => x.id === T.id) : null;
  let folder = old ? old.folder : undefined;
  if (!old) {
    // 初めて保存するときは、保存先のフォルダを選ぶ
    const f = await pickFolder('どのフォルダに保存しますか？', null);

  }

  const list = readSaved();

}

      more.className = 'more';
      more.textContent = '…';
      more.setAttribute('aria-label', 'フォルダ「' + sec.name + '」の操作');
      more.onclick = () => folderMenu(sec.f);
      head.appendChild(more);
    }
    wrap.appendChild(head);
    if (isOpen) {
      const body = document.createElement('div');
      body.className = 'folder-body';
      body.dataset.folder = sec.id;
      if (!items.length) {
        const p = document.createElement('div');
        p.className = 'empty';
        p.textContent = '作戦はまだありません。作戦の「移動」から、このフォルダへ移せます。';
        body.appendChild(p);
      }
      for (const it of items) body.appendChild(itemCard(it, sec.id));
      wrap.appendChild(body);
    }
    box.appendChild(wrap);
  }
}
function itemCard(it, folderId) {
  const card = document.createElement('div');
  card.className = 'item';
  card.dataset.id = it.id;
  const head = document.createElement('div');
  head.className = 'head';
  const handle = document.createElement('button');
  handle.className = 'handle';
  handle.textContent = '≡';
  handle.setAttribute('aria-label', '「' + it.name + '」を並べ替える');
  const n = document.createElement('div');
  n.className = 'name';
  n.textContent = it.name + (it.id === T.id ? '(表示中)' : '');
  const m = document.createElement('div');
  m.className = 'meta';
  const frames = it.d && Array.isArray(it.d.f) ? it.d.f.length : 0;
  m.textContent = 'コマ' + frames + ' ・ ' + new Date(it.updated).toLocaleString('ja-JP', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
  const row = document.createElement('div');
  row.className = 'row';
  const mk = (label, fn, cls) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; row.appendChild(b); };
  mk('開く', async () => {
    if (it.id !== T.id && !await confirmDiscard()) return;
    try { openTactic(unpack(it.d), it.id, false); } catch { toast('この作戦は開けませんでした'); return; }
    $('sheet').hidden = true;
  }, 'grow');
  mk('複製', () => {
    const l = readSaved();
    l.unshift({id: newId(), name: it.name + ' のコピー', updated: Date.now(), d: it.d, ...(folderId ? {folder: folderId} : {})});
    if (writeSaved(l)) { renderList(); toast('複製しました'); }
  });
  mk('移動', async () => {
    const f = await pickFolder('「' + it.name + '」をどのフォルダへ移しますか？', folderId);
    if (f === null) return;
    writeSaved(readSaved().map(x => { if (x.id !== it.id) return x; const y = {...x}; if (f) y.folder = f; else delete y.folder; return y; }));
    // 移した先のフォルダを開いて見せる
    writeJSON(KEY_CLOSED, readClosed().filter(x => x !== f));
    renderList();
    toast('移しました');
  });
  mk('削除', async () => {
    if (!await ask('「' + it.name + '」を削除しますか？', '削除する', true)) return;
    writeSaved(readSaved().filter(x => x.id !== it.id));
    if (T.id === it.id) { T.id = null; markDirty(); }
    renderList();
  }, 'danger');
  head.append(n, handle);
  card.append(head, m, row);
  return card;
}
// 作戦のつまみ(≡)を押したまま上下にドラッグすると、同じフォルダの中で順番を入れ替えられる
let ldrag = null;
const listBox = $('list'), sheetBody = $('sheet').querySelector('.sheet-body');
listBox.addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle');
  if (!h || ldrag) return;
  const card = h.closest('.item');
  ldrag = {card, body: card.parentElement, id: e.pointerId};
  card.classList.add('lift');
  // カードはドラッグ中に移動するので、動かない一覧の枠でマウスや指を追いかける
  try { listBox.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
});
listBox.addEventListener('pointermove', e => {
  if (!ldrag || e.pointerId !== ldrag.id) return;
  const others = [...ldrag.body.querySelectorAll(':scope > .item')].filter(x => x !== ldrag.card);
  const before = others.find(x => { const r = x.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
  if (before) { if (before !== ldrag.card.nextSibling) ldrag.body.insertBefore(ldrag.card, before); }
  else if (ldrag.card !== ldrag.body.lastElementChild) ldrag.body.appendChild(ldrag.card);
  // 上下の端に近づいたら自動でスクロールする
  const r = sheetBody.getBoundingClientRect();
  if (e.clientY < r.top + 40) sheetBody.scrollTop -= 10;
  else if (e.clientY > r.bottom - 40) sheetBody.scrollTop += 10;
});
function endListDrag(e) {
  if (!ldrag || e.pointerId !== ldrag.id) return;
  const {card, body} = ldrag;
  card.classList.remove('lift');
  ldrag = null;
  // 動かしたフォルダの作戦だけを、画面の順番に並べ直す(ほかの作戦の位置はそのまま)
  const order = [...body.querySelectorAll(':scope > .item')].map(x => x.dataset.id);
  const list = readSaved();
  const slots = list.map((x, i) => order.includes(x.id) ? i : -1).filter(i => i >= 0);
  const moved = order.map(id => list.find(x => x.id === id)).filter(Boolean);
  if (moved.length === slots.length) {
    const next = list.slice();
    slots.forEach((slot, k) => { next[slot] = moved[k]; });
    if (next.some((x, i) => x !== list[i])) writeSaved(next);
  }
  renderList();
}
listBox.addEventListener('pointerup', endListDrag);
listBox.addEventListener('pointercancel', endListDrag);
// 追いかけが外れても、どこで離したかに関係なくドラッグを終える
listBox.addEventListener('lostpointercapture', endListDrag);
window.addEventListener('pointerup', endListDrag);
$('newFolderBtn').onclick = async () => {
  const id = await createFolder();
  if (id) { renderList(); toast('フォルダを作りました'); }
};
$('listBtn').onclick = () => { stop(); renderList(); $('sheet').hidden = false; };
$('closeBtn').onclick = () => { $('sheet').hidden = true; };
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').hidden = true; });
$('newBtn').onclick = async () => {
  if (!await confirmDiscard()) return;
  openTactic(newTactic(), null, false);
  $('sheet').hidden = true;
  toast('新しい作戦を作りました');
};

// ---------- 共有リンク ----------
function b64u(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64u(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function pipe(u, stream) {
  return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(stream)).arrayBuffer());
}
const objBytes = o => new TextEncoder().encode(JSON.stringify(o));
const jsonBytes = t => objBytes(pack(t));
async function encodeObj(o) {
  if ('CompressionStream' in window) {
    try { return 'z' + b64u(await pipe(objBytes(o), new CompressionStream('deflate-raw'))); } catch {}
  }
  return 'j' + b64u(objBytes(o));
}
async function decodeObj(s) {
  const u = unb64u(s.slice(1));
  const bytes = s[0] === 'z' ? await pipe(u, new DecompressionStream('deflate-raw')) : u;
  return JSON.parse(new TextDecoder().decode(bytes));
}
const encode = t => encodeObj(pack(t));
const decode = async s => unpack(await decodeObj(s));
const baseUrl = () => location.href.split('#')[0];
let shareTimer = null;
function scheduleShare() {
  shareCode = null;
  clearTimeout(shareTimer);
  shareTimer = setTimeout(async () => {
    const snap = T, code = await encode(T);
    if (snap === T) shareCode = code;
  }, 300);
}
function copyLink(url) {
  const fallback = () => showLink(url);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(() => toast('共有リンクをコピーしました。LINEなどに貼り付けて送れます'), fallback);
  } else fallback();
}
// #t= は編集もできるリンク、#v= は見るだけのリンク
$('shareBtn').onclick = async () => {
  stop();
  const kind = await openChoice('どちらのリンクを作りますか？', [
    {key: 'v', label: '見るだけ(再生だけできる)'},
    {key: 't', label: '編集もできる'}
  ]);
  if (!kind) return;
  const url = baseUrl() + '#' + kind + '=' + (shareCode || 'j' + b64u(jsonBytes(T)));
  sendLink(url, T.name, 'フットサル作戦「' + T.name + '」' + (kind === 'v' ? '(見るだけ)' : ''));
};
function sendLink(url, title, text) {
  if (navigator.share && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    navigator.share({title, text, url}).catch(err => { if (err.name !== 'AbortError') copyLink(url); });
  } else copyLink(url);
}

// ---------- まとめて共有(#l= は一覧ごとの見るだけリンク) ----------
// 形式: {v, n:題名, g:[フォルダ名], t:[[フォルダの番号(なしは-1), 作戦]]}
$('bundleShareBtn').onclick = async () => {
  const list = readSaved(), folders = readFolders();
  if (!list.length) { toast('保存した作戦がまだありません'); return; }
  const opts = [{key: 'all', label: 'すべての作戦(' + list.length + ')'}];
  for (const f of folders) {
    const n = list.filter(x => folderOf(x, folders) === f.id).length;
    if (n) opts.push({key: 'f:' + f.id, label: f.name + '(' + n + ')'});
  }
  const un = list.filter(x => !folderOf(x, folders)).length;
  if (un && folders.length) opts.push({key: 'f:', label: '未分類(' + un + ')'});
  const key = await openChoice('どの作戦を「見るだけ」で共有しますか？', opts);
  if (!key) return;
  const fid = key === 'all' ? null : key.slice(2);
  const items = list.filter(x => fid === null || folderOf(x, folders) === fid);
  const used = folders.filter(f => fid === null ? items.some(x => folderOf(x, folders) === f.id) : f.id === fid);
  const title = fid === null ? 'すべての作戦' : fid ? used[0].name : '未分類';
  const obj = {v: 1, n: title, g: used.map(f => f.name), t: items.map(x => [used.findIndex(f => f.id === folderOf(x, folders)), x.d])};
  const url = baseUrl() + '#l=' + await encodeObj(obj);
  if (url.length > 8000) toast('リンクがとても長いため、送れないアプリがあります。フォルダごとの共有がおすすめです');
  sendLink(url, title, 'フットサル作戦「' + title + '」(見るだけ・' + items.length + '件)');
};
let bundle = null;
function openBundle(o) {
  if (!o || !Array.isArray(o.t)) throw new Error('bad data');
  const g = (Array.isArray(o.g) ? o.g : []).slice(0, 50).map(x => String(x).slice(0, 30));
  const t = o.t.slice(0, 200).map(x => {
    try { return Array.isArray(x) ? {g: Number(x[0]), tac: unpack(x[1])} : null; } catch { return null; }
  }).filter(Boolean);
  if (!t.length) throw new Error('empty');
  bundle = {name: String(o.n || '作戦一覧').slice(0, 60), g, t};
}
function renderBundle() {
  const box = $('list');
  box.textContent = '';
  $('sheetTitle').textContent = bundle.name;
  const groups = [...bundle.g.map((name, i) => ({i, name})), {i: -1, name: bundle.g.length ? '未分類' : ''}];
  for (const grp of groups) {
    const items = bundle.t.filter(x => (x.g >= 0 && x.g < bundle.g.length ? x.g : -1) === grp.i);
    if (!items.length) continue;
    const wrap = document.createElement('div');
    wrap.className = 'folder';
    if (grp.name) {
      const h = document.createElement('div');
      h.className = 'folder-head';
      const label = document.createElement('div');
      label.style.cssText = 'font-weight:600;font-size:15px;padding:4px';
      label.textContent = grp.name + '(' + items.length + ')';
      h.appendChild(label);
      wrap.appendChild(h);
    }
    const body = document.createElement('div');
    if (grp.name) body.className = 'folder-body';
    for (const it of items) {
      const card = document.createElement('div');
      card.className = 'item';
      const n = document.createElement('div');
      n.className = 'name';
      n.textContent = it.tac.name + (T === it.tac ? '(表示中)' : '');
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = 'コマ' + it.tac.frames.length;
      const b = document.createElement('button');
      b.className = 'wide primary';
      b.textContent = '▶ 見る';
      b.onclick = () => {
        stop();
        T = it.tac; cur = 0;
        renderAll();
        $('sheet').hidden = true;
        setTimeout(play, 300);
      };
      card.append(n, m, b);
      body.appendChild(card);
    }
    wrap.appendChild(body);
    box.appendChild(wrap);
  }
}
$('bundleBtn').onclick = () => { stop(); renderBundle(); $('sheet').hidden = false; };

function enterView() {
  viewOnly = true;
  document.body.classList.add('view');
  $('name').readOnly = true;
  $('memo').readOnly = true;
  tool = 'move';
  applyMode();
}
async function loadFromHash() {
  const h = location.hash.match(/^#([tvl])=([A-Za-z0-9_-]+)$/);
  if (!h) return false;
  if (viewOnly && h[1] === 't') { location.reload(); return false; }
  // 見るだけのリンクは、開き直しても同じ表示になるようにURLを残す
  if (h[1] === 't') history.replaceState(null, '', baseUrl());
  if (h[1] === 'l') {
    try { openBundle(await decodeObj(h[2])); }
    catch { toast('共有リンクを読み込めませんでした'); return false; }
    enterView();
    stop();
    T = bundle.t[0].tac; cur = 0;
    resetUndo();
    renderAll();
    $('bundleBtn').hidden = false;
    renderBundle();
    $('sheet').hidden = false;
    return true;
  }
  let t;
  try { t = await decode(h[2]); }
  catch { toast('共有リンクを読み込めませんでした'); return false; }
  if (h[1] === 'v') {
    enterView();
    stop();
    T = t; cur = 0;
    resetUndo();
    renderAll();
    $('bundleBtn').hidden = true;
    toast('見るだけモードで開きました');
    setTimeout(play, 700);
    return true;
  }
  if (dirty) {
    // 保存していない作業は、消さずに一覧へ退避する
    const list = readSaved();
    list.unshift({id: newId(), name: T.name + '(未保存の作業)', updated: Date.now(), d: pack(T)});
    writeSaved(list);
  }
  openTactic(t, null, true);
  toast('共有された作戦「' + t.name + '」を読み込みました');
  setTimeout(play, 700);
  return true;
}
window.addEventListener('hashchange', loadFromHash);

// ---------- 起動 ----------
(async () => {
  if (/^#[vl]=/.test(location.hash)) enterView();
  else {
    try {
      const d = JSON.parse(localStorage.getItem(KEY_DRAFT));
      if (d && d.d) { T = unpack(d.d); T.id = d.id || null; dirty = !!d.dirty; }
    } catch {}
  }
  applyMode();
  renderAll();
  scheduleShare();
  await loadFromHash();
})();
</script>
