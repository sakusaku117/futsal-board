<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>フットサル作戦ボード</title>
<style>
:root{
  --bg:#f3f4f1;--surface:#ffffff;--text:#1d1f1c;--sub:#5f625c;--border:#d3d6cf;
  --accent:#185FA5;--accent-bg:#E6F1FB;--on-accent:#ffffff;--danger:#A32D2D;--on-danger:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141513;--surface:#1f211e;--text:#eceee9;--sub:#a3a69f;--border:#3a3d37;
    --accent:#85B7EB;--accent-bg:#0C2C4C;--on-accent:#0b1a2a;--danger:#F09595;--on-danger:#2a0b0b;
  }
}
:root[data-theme="dark"]{
  --bg:#141513;--surface:#1f211e;--text:#eceee9;--sub:#a3a69f;--border:#3a3d37;
  --accent:#85B7EB;--accent-bg:#0C2C4C;--on-accent:#0b1a2a;--danger:#F09595;--on-danger:#2a0b0b;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{max-width:480px;margin:0 auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;min-height:100dvh}
.row{display:flex;gap:6px;align-items:center}
.grow{flex:1;min-width:0}
button{font:inherit;font-size:14px;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:0 10px;height:38px;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap}
button:active{transform:scale(.97)}
button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
input[type=text]{font:inherit;font-size:16px;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:8px;height:38px;padding:0 10px;width:100%}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px}
.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.modes button{padding:0 2px;font-size:12px;flex-direction:column;gap:2px;height:42px}
.court-wrap{display:flex;justify-content:center}
#court{width:min(100%,calc((100dvh - 309px) * 0.532));min-width:200px;aspect-ratio:23/43.2;
  display:block;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px}
#court .arrow-hit{pointer-events:none}
#court.draw .arrow-hit{pointer-events:stroke}
#court.draw .piece{pointer-events:none}
#court.move .piece{cursor:grab}
#court.draw{cursor:crosshair}
#court .bubbles{pointer-events:none}
#court.bubble .bubbles{pointer-events:auto}
#court.bubble .piece{pointer-events:none}
#court.bubble{cursor:pointer}
.frames{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.frames::-webkit-scrollbar{display:none}
.frames button{flex:0 0 auto;height:34px;font-size:13px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet[hidden]{display:none}
.sheet-body{background:var(--bg);width:100%;max-width:480px;max-height:80dvh;overflow:auto;
  border-radius:16px 16px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;font-weight:600;margin:0}
.item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px}
.item .name{font-size:15px;font-weight:600;word-break:break-all}
.item .meta{font-size:12px;color:var(--sub);margin:2px 0 8px}
.item button{height:34px;font-size:13px}
.empty{color:var(--sub);font-size:14px;padding:16px 4px}
.danger{color:var(--danger)}
button.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.dlg[hidden]{display:none}
.dlg-body{background:var(--bg);width:100%;max-width:360px;border-radius:14px;padding:16px}
.dlg-body p{margin:0 0 14px;font-size:15px;line-height:1.6;word-break:break-all}
.dlg-body input{margin-bottom:14px}
#dlgLink{font-size:14px}
.dlg-err{color:var(--danger);font-size:13px;margin:-8px 0 12px}
#toast{position:fixed;left:50%;top:calc(100px + env(safe-area-inset-top));transform:translateX(-50%);
  background:#2c2c2a;color:#fff;font-size:14px;padding:9px 14px;border-radius:8px;
  max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="row">
    <input type="text" id="name" class="grow" maxlength="60" aria-label="作戦名">
    <button id="listBtn">一覧</button>
    <button id="saveBtn">保存</button>
  </div>

  <div class="modes" id="modes">
    <button data-mode="move" class="on">移動</button>
    <button data-mode="pass"><svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="#D99A00" stroke-width="2" stroke-dasharray="4 3"/></svg>パス</button>
    <button data-mode="drib"><svg width="18" height="8" aria-hidden="true"><path d="M1 4q2-3 4 0t4 0 4 0 4 0" fill="none" stroke="#D85A30" stroke-width="2"/></svg>ドリブル</button>
    <button data-mode="run"><svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="currentColor" stroke-width="2"/></svg>動き</button>
    <button data-mode="shot"><svg width="18" height="8" aria-hidden="true"><path d="M1 4H12" stroke="#E53935" stroke-width="3"/><path d="M11 0L17 4L11 8Z" fill="#E53935"/></svg>シュート</button>
    <button data-mode="bubble"><svg width="18" height="10" aria-hidden="true"><path d="M2 1H16Q17 1 17 2V6Q17 7 16 7H8L4 10V7H2Q1 7 1 6V2Q1 1 2 1Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>吹き出し</button>
  </div>

  <div class="court-wrap">
    <svg id="court" class="move" viewBox="-1.5 -1.6 23 43.2" role="img" aria-label="フットサルコート">
      <rect x="-1.5" y="-1.6" width="23" height="43.2" fill="#167F5C"/>
      <rect x="0" y="0" width="20" height="40" fill="#1D9E75"/>
      <g fill="none" stroke="#E8F7F0" stroke-width="0.12">
        <rect x="0" y="0" width="20" height="40"/>
        <line x1="0" y1="20" x2="20" y2="20"/>
        <circle cx="10" cy="20" r="3"/>
        <path d="M2.5 0A6 6 0 0 0 8.5 6L11.5 6A6 6 0 0 0 17.5 0"/>
        <path d="M2.5 40A6 6 0 0 1 8.5 34L11.5 34A6 6 0 0 1 17.5 40"/>
        <path d="M8.5 0V-1H11.5V0"/>
        <path d="M8.5 40V41H11.5V40"/>
      </g>
      <g fill="#E8F7F0">
        <circle cx="10" cy="20" r="0.15"/>
        <circle cx="10" cy="6" r="0.12"/><circle cx="10" cy="10" r="0.12"/>
        <circle cx="10" cy="34" r="0.12"/><circle cx="10" cy="30" r="0.12"/>
      </g>
      <g id="arrows"></g>
      <g id="pieces"></g>
      <g id="bubbles" class="bubbles"></g>
    </svg>
  </div>

  <input type="text" id="memo" maxlength="200" placeholder="このコマのメモ(例:4番が縦に抜ける)" aria-label="メモ">

  <div class="frames" id="frames"></div>

  <div class="row">
    <button id="prevBtn" aria-label="コマを前へ移動" title="コマを前へ移動">◀</button>
    <button id="nextBtn" aria-label="コマを後ろへ移動" title="コマを後ろへ移動">▶</button>
    <button id="addBtn" class="grow">＋ コマ追加</button>
    <button id="hideBtn" style="font-size:12px;padding:0 6px">動き矢印:表示</button>
    <button id="delBtn" class="danger">削除</button>
  </div>

  <div class="row">
    <button id="playBtn" class="primary grow">▶ 再生</button>
    <button id="speedBtn">普通</button>
    <button id="undoBtn">↶ 戻す</button>
    <button id="shareBtn">共有</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-body">
    <div class="row">
      <h2 class="grow">保存した作戦</h2>
      <button id="newBtn">＋ 新規作成</button>
      <button id="closeBtn">閉じる</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<div class="dlg" id="dlg" hidden>
  <div class="dlg-body" role="dialog" aria-modal="true" aria-labelledby="dlgMsg">
    <p id="dlgMsg"></p>
    <input type="text" id="dlgLink" readonly hidden aria-label="共有リンク">
    <input type="text" id="dlgText" maxlength="30" hidden aria-label="吹き出しの文字">
    <div class="dlg-err" id="dlgErr" hidden></div>
    <div class="row">
      <button id="dlgExtra" class="danger" hidden>削除</button>
      <button id="dlgCancel" class="grow">やめる</button>
      <button id="dlgOk" class="grow">OK</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const TYPES = ['pass', 'drib', 'run', 'shot'];
const ARROW = {
  pass: {color: '#FFE08A', dash: '0.7 0.45', w: 0.22, hl: 0.75, hw: 0.42},
  drib: {color: '#FFB4A0', dash: null, w: 0.22, hl: 0.75, hw: 0.42},
  run:  {color: '#FFFFFF', dash: null, w: 0.22, hl: 0.75, hw: 0.42},
  shot: {color: '#FF3B3B', dash: null, w: 0.42, hl: 1.15, hw: 0.75}
};
const straight = t => t === 'pass' || t === 'shot';
const SPEEDS = [{label: 'ゆっくり', ms: 2000}, {label: '普通', ms: 1200}, {label: '速い', ms: 700}];
const KEY_SAVED = 'futsalBoard.saved';
const KEY_DRAFT = 'futsalBoard.draft';

// 駒の並び: 0-4 味方(0はGK), 5-9 相手(5はGK), 10 ボール
function defaultPos() {
  return [10,38, 10,31, 4,26, 16,26, 10,22,
          10,2,  10,9,  4,14, 16,14, 10,18,
          10,20.6];
}
function newTactic() {
  return {id: null, name: '新しい作戦', hideRun: false, frames: [{p: defaultPos(), a: [], b: [], m: ''}]};
}

let T = newTactic();
let cur = 0, mode = 'move', dirty = false, playing = false, speed = 1;
let shareUrl = null;

const $ = id => document.getElementById(id);
const svg = $('court'), gArrows = $('arrows'), gPieces = $('pieces');
const f2 = v => v.toFixed(2);

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

// ---------- 駒 ----------
const pieceEls = [];
for (let i = 0; i < 11; i++) {
  const g = el('g', {class: 'piece', 'data-i': i}, gPieces);
  if (i < 10) {
    const own = i < 5, gk = i === 0 || i === 5;
    const fill = own ? (gk ? '#0C447C' : '#378ADD') : (gk ? '#993C1D' : '#E8743F');
    const stroke = own ? '#042C53' : '#4A1B0C';
    el('circle', {r: 1.6, fill: 'transparent'}, g);
    el('circle', {r: 0.8, fill, stroke, 'stroke-width': 0.1}, g);
    const t = el('text', {'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': gk ? 0.62 : 0.85, 'font-weight': 'bold', fill: '#fff', 'pointer-events': 'none'}, g);
    t.textContent = gk ? 'GK' : String(i % 5);
  } else {
    el('circle', {r: 1.2, fill: 'transparent'}, g);
    el('circle', {r: 0.45, fill: '#fff', stroke: '#222', 'stroke-width': 0.09}, g);
    el('circle', {r: 0.16, fill: '#222'}, g);
  }
  pieceEls.push(g);
}
function setPos(p) {
  for (let i = 0; i < 11; i++) pieceEls[i].setAttribute('transform', `translate(${f2(p[2*i])},${f2(p[2*i+1])})`);
}

// ---------- 矢印 ----------
const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
function smoothPath(pts) {
  if (pts.length < 3) return `M${f2(pts[0][0])},${f2(pts[0][1])}` + pts.slice(1).map(q => `L${f2(q[0])},${f2(q[1])}`).join('');
  let d = `M${f2(pts[0][0])},${f2(pts[0][1])}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i+1][0]) / 2, my = (pts[i][1] + pts[i+1][1]) / 2;
    d += `Q${f2(pts[i][0])},${f2(pts[i][1])} ${f2(mx)},${f2(my)}`;
  }
  const last = pts[pts.length-1];
  return d + `L${f2(last[0])},${f2(last[1])}`;
}
function wavyPath(pts) {
  const segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = dist(pts[i-1], pts[i]); segs.push(l); total += l; }
  if (total < 0.01) return smoothPath(pts);
  let d = '', seg = 0, segStart = 0;
  for (let s = 0; s <= total + 1e-6; s += 0.12) {
    while (seg < segs.length - 1 && s > segStart + segs[seg]) { segStart += segs[seg]; seg++; }
    const a = pts[seg], b = pts[seg+1], k = segs[seg] ? Math.min(1, (s - segStart) / segs[seg]) : 0;
    const tx = (b[0]-a[0]) / (segs[seg] || 1), ty = (b[1]-a[1]) / (segs[seg] || 1);
    const amp = 0.3 * Math.max(0, Math.min(1, s / 0.5, (total - s) / 0.6));
    const off = amp * Math.sin(2 * Math.PI * s / 1.0);
    const x = a[0] + (b[0]-a[0]) * k - ty * off, y = a[1] + (b[1]-a[1]) * k + tx * off;
    d += (d ? 'L' : 'M') + f2(x) + ',' + f2(y);
  }
  return d;
}
function arrowGeom(a) {
  let pts = straight(a.t) ? [a.pts[0], a.pts[a.pts.length-1]] : a.pts;
  const end = pts[pts.length-1];
  let k = pts.length - 2;
  while (k > 0 && dist(pts[k], end) < 0.6) k--;
  const from = pts[Math.max(k, 0)];
  let dx = end[0] - from[0], dy = end[1] - from[1];
  const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  const {hl, hw} = ARROW[a.t];
  const bx = end[0] - dx*hl, by = end[1] - dy*hl;
  const head = `M${f2(end[0])},${f2(end[1])}L${f2(bx - dy*hw)},${f2(by + dx*hw)}L${f2(bx + dy*hw)},${f2(by - dx*hw)}Z`;
  const linePts = pts.slice(0, -1).concat([[end[0] - dx*hl*0.7, end[1] - dy*hl*0.7]]);
  const d = a.t === 'drib' ? wavyPath(linePts) : smoothPath(linePts);
  return {d, head};
}
function drawArrow(a, parent, k) {
  const g = el('g', {}, parent);
  const {d, head} = arrowGeom(a);
  const st = ARROW[a.t];
  el('path', {d, fill: 'none', stroke: 'rgba(0,0,0,.28)', 'stroke-width': st.w + 0.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'pointer-events': 'none'}, g);
  const line = el('path', {d, fill: 'none', stroke: st.color, 'stroke-width': st.w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'pointer-events': 'none'}, g);
  if (st.dash) line.setAttribute('stroke-dasharray', st.dash);
  el('path', {d: head, fill: st.color, stroke: 'rgba(0,0,0,.28)', 'stroke-width': 0.08, 'pointer-events': 'none'}, g);
  if (k != null) el('path', {d, class: 'arrow-hit', 'data-k': k, fill: 'none', stroke: 'transparent', 'stroke-width': 1.4}, g);
  return g;
}

// ---------- 矢印に沿った動き ----------
// 再生や自動配置で駒がたどる線(描いた矢印と同じ形)
function movePath(a) {
  const pts = a.pts;
  if (straight(a.t) || pts.length < 3) return [pts[0], pts[pts.length-1]];
  const out = [pts[0]];
  let prev = pts[0];
  for (let i = 1; i < pts.length - 1; i++) {
    const c = pts[i], end = i < pts.length - 2 ? [(pts[i][0] + pts[i+1][0]) / 2, (pts[i][1] + pts[i+1][1]) / 2] : pts[i+1];
    for (let t = 0.25; t <= 1.001; t += 0.25) {
      const u = 1 - t;
      out.push([u*u*prev[0] + 2*u*t*c[0] + t*t*end[0], u*u*prev[1] + 2*u*t*c[1] + t*t*end[1]]);
    }
    prev = end;
  }
  return out;
}
function pointAt(path, k) {
  let total = 0;
  const segs = [];
  for (let i = 1; i < path.length; i++) { const l = dist(path[i-1], path[i]); segs.push(l); total += l; }
  let rest = k * total;
  for (let i = 0; i < segs.length; i++) {
    if (rest <= segs[i] || i === segs.length - 1) {
      const r = segs[i] ? Math.min(1, rest / segs[i]) : 1;
      return [path[i][0] + (path[i+1][0] - path[i][0]) * r, path[i][1] + (path[i+1][1] - path[i][1]) * r];
    }
    rest -= segs[i];
  }
  return path[path.length-1];
}
// 矢印の描き始めの近くにいる駒を探して、矢印と結びつける
function links(f) {
  const p = f.p, used = new Set(), res = [];
  const near = (from, to, s, maxD) => {
    let best = -1, bd = maxD;
    for (let i = from; i < to; i++) {
      if (used.has(i)) continue;
      const d = Math.hypot(p[2*i] - s[0], p[2*i+1] - s[1]);
      if (d <= bd) { bd = d; best = i; }
    }
    if (best >= 0) used.add(best);
    return best;
  };
  for (const a of f.a) {
    const s = a.pts[0], path = movePath(a);
    if (a.t !== 'run') { const b = near(10, 11, s, 2.5); if (b >= 0) res.push({i: b, path, a}); }
    if (a.t === 'run' || a.t === 'drib') { const q = near(0, 10, s, 2.0); if (q >= 0) res.push({i: q, path, a}); }
  }
  return res;
}
// コマiからコマi+1へ、割合kのときの全駒の位置
function framePos(i, k) {
  const a = T.frames[i].p, b = T.frames[i+1].p;
  const out = a.map((v, j) => v + (b[j] - v) * k);
  for (const l of links(T.frames[i])) {
    const P = pointAt(l.path, k), s = l.path[0], e = l.path[l.path.length-1], j = l.i;
    out[2*j]   = P[0] + (a[2*j]   - s[0]) * (1 - k) + (b[2*j]   - e[0]) * k;
    out[2*j+1] = P[1] + (a[2*j+1] - s[1]) * (1 - k) + (b[2*j+1] - e[1]) * k;
  }
  return out;
}
// 次のコマの配置:矢印と結びついた駒を矢印の先へ置く
function nextPos(f) {
  const p = f.p.slice();
  for (const l of links(f)) {
    const e = l.path[l.path.length-1];
    let x = e[0], y = e[1];
    if (l.i === 10 && l.a.t === 'drib') {
      // ドリブルはボールを選手の少し前に置く
      const q = pointAt(l.path, 0.9), dx = e[0] - q[0], dy = e[1] - q[1], len = Math.hypot(dx, dy) || 1;
      x += dx / len * 1.1; y += dy / len * 1.1;
    }
    p[2*l.i] = clampX(x); p[2*l.i+1] = clampY(y);
  }
  return p;
}

function renderArrows() {
  gArrows.textContent = '';
  // 「非表示」のときは、再生中だけ動きの矢印を描かない(駒は矢印に沿って動く)
  const hide = playing && T.hideRun;
  T.frames[cur].a.forEach((a, k) => { if (!(hide && a.t === 'run')) drawArrow(a, gArrows, k); });
  renderBubbles();
}

// ---------- 画面の更新 ----------
function renderFrames() {
  const box = $('frames');
  box.textContent = '';
  T.frames.forEach((f, i) => {
    const b = document.createElement('button');
    if (i === cur) b.className = 'on';
    b.textContent = 'コマ' + (i + 1) + (f.m ? ' ✎' : '');
    b.onclick = () => { stop(); select(i); };
    box.appendChild(b);
  });
  const on = box.children[cur];
  if (on) {
    const l = on.offsetLeft - box.offsetLeft, r = l + on.offsetWidth;
    if (l < box.scrollLeft) box.scrollLeft = l - 8;
    else if (r > box.scrollLeft + box.clientWidth) box.scrollLeft = r - box.clientWidth + 8;
  }
}
function select(i) {
  cur = Math.max(0, Math.min(i, T.frames.length - 1));
  setPos(T.frames[cur].p);
  renderArrows();

let toastTimer = null;

// ---------- 吹き出し ----------
const gBubbles = $('bubbles');
const BFS = 1.0, BLH = 1.2;
function wrapText(t) {
  const chars = Array.from(t), lines = [];
  for (let i = 0; i < chars.length; i += 9) lines.push(chars.slice(i, i + 9).join(''));
  return lines.length ? lines : [''];
}
// 文字幅の目安(全角は1文字、半角は約半分)
const textW = line => Array.from(line).reduce((w, c) => w + (c.charCodeAt(0) < 0x2000 ? 0.55 : 1), 0) * BFS;
function bubbleSize(t) {
  const lines = wrapText(t);
  return {lines, w: Math.max(...lines.map(textW)) + 1.0, h: lines.length * BLH * BFS + 0.7};
}
function renderBubbles() {
  gBubbles.textContent = '';
  (T.frames[cur].b || []).forEach((b, k) => {
    const g = el('g', {}, gBubbles);
    const {lines, w, h} = bubbleSize(b.t);
    const x0 = b.bx - w/2, y0 = b.by - h/2;
    // しっぽ:吹き出しの縁からポイントへ
    let tail = null;
    const dx = b.x - b.bx, dy = b.y - b.by;
    if (Math.abs(dx) > w/2 || Math.abs(dy) > h/2) {
      const len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
      const t = Math.min(dx ? (w/2) / Math.abs(dx) : Infinity, dy ? (h/2) / Math.abs(dy) : Infinity);
      const ex = b.bx + dx * t - ux * 0.15, ey = b.by + dy * t - uy * 0.15;
      const hw = Math.min(0.45, w/2 - 0.2);
      tail = `M${f2(ex - uy*hw)},${f2(ey + ux*hw)}L${f2(b.x)},${f2(b.y)}L${f2(ex + uy*hw)},${f2(ey - ux*hw)}Z`;
      el('path', {d: tail, fill: '#fff', stroke: '#222', 'stroke-width': 0.08, 'stroke-linejoin': 'round'}, g);
    }
    el('rect', {x: f2(x0), y: f2(y0), width: f2(w), height: f2(h), rx: 0.35, fill: '#fff', stroke: '#222', 'stroke-width': 0.08, class: 'bubble-box', 'data-k': k}, g);
    if (tail) el('path', {d: tail, fill: '#fff', 'pointer-events': 'none'}, g);
    lines.forEach((line, i) => {
      const t = el('text', {x: f2(b.bx), y: f2(y0 + 0.35 + (i + 0.5) * BLH * BFS), 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-size': BFS, fill: '#1d1f1c', 'pointer-events': 'none'}, g);
      t.textContent = line;
    });
    el('circle', {cx: f2(b.x), cy: f2(b.y), r: 0.28, fill: '#FFE08A', stroke: '#222', 'stroke-width': 0.07, 'pointer-events': 'none'}, g);
    el('circle', {cx: f2(b.x), cy: f2(b.y), r: 1.0, fill: 'transparent', class: 'bubble-pt', 'data-k': k}, g);
  });
}
async function bubbleText(value, canDelete) {
  return openDlg({msg: canDelete ? '吹き出しの文字を直す' : '吹き出しの文字を入力してください(30文字まで)',
    ok: '決定', okClass: 'primary', cancel: true, text: value, extra: canDelete ? '削除' : null});
}
async function addBubble(x, y) {
  const r = await bubbleText('', false);
  if (!r.ok) return;
  const {w, h} = bubbleSize(r.text);
  let by = y - 3;
  if (by - h/2 < -1.2) by = y + 3;
  const bx = Math.max(-1 + w/2, Math.min(21 - w/2, x));
  pushUndo();
  T.frames[cur].b.push({x, y, bx, by, t: r.text});
  renderBubbles();
  markDirty();
}
async function editBubble(k) {
  const b = T.frames[cur].b[k];
  const r = await bubbleText(b.t, true);
  if (r.extra) { pushUndo(); T.frames[cur].b.splice(k, 1); }
  else if (r.ok && r.text !== b.t) { pushUndo(); T.frames[cur].b[k].t = r.text; }
  else return;
  renderBubbles();
  markDirty();
}

// ---------- 戻す ----------
let undoStack = [], lastTextKey = null;
// 変更の直前に呼ぶ。文字入力は同じ欄への連続入力を1回分にまとめる
function pushUndo(textKey) {
  if (textKey && textKey === lastTextKey) return;
  undoStack.push({name: T.name, hideRun: T.hideRun, frames: structuredClone(T.frames), cur});
  if (undoStack.length > 50) undoStack.shift();
  lastTextKey = textKey || null;
}
function resetUndo() { undoStack = []; lastTextKey = null; }
for (const id of ['name', 'memo']) $(id).addEventListener('blur', () => { lastTextKey = null; });
$('undoBtn').onclick = () => {
  stop();

  lastTextKey = null;

  T.hideRun = u.hideRun;

// ---------- 操作 ----------
function svgPt(e) {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const r = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [r.x, r.y];
}
const clampX = x => Math.max(-0.8, Math.min(20.8, x));
const clampY = y => Math.max(-1, Math.min(41, y));
let drag = null, draw = null, bdrag = null;

svg.addEventListener('pointerdown', e => {
  if (playing) stop();
  if (drag || draw || bdrag) return;
  const [x, y] = svgPt(e);
  if (mode === 'move') {
    const g = e.target.closest('.piece');
    if (!g) return;
    const i = +g.dataset.i, p = T.frames[cur].p;
    drag = {i, dx: p[2*i] - x, dy: p[2*i+1] - y, id: e.pointerId, moved: false};
    gPieces.appendChild(g);
    if (i !== 10) gPieces.appendChild(pieceEls[10]);
  } else if (mode === 'bubble') {
    const pt = e.target.closest('.bubble-pt'), box = e.target.closest('.bubble-box');
    const k = pt ? +pt.dataset.k : box ? +box.dataset.k : null;
    const b = k != null ? T.frames[cur].b[k] : null;
    bdrag = {k, part: pt ? 'pt' : box ? 'box' : 'new', sx: x, sy: y, o: b ? {...b} : null, id: e.pointerId, moved: false};
  } else {
    const hit = e.target.closest('.arrow-hit');
    draw = {pts: [[clampX(x), clampY(y)]], hit: hit ? +hit.dataset.k : null, id: e.pointerId, g: null};
  }
  svg.setPointerCapture(e.pointerId);
  e.preventDefault();
});
svg.addEventListener('pointermove', e => {
  if (drag && e.pointerId === drag.id) {
    if (!drag.moved) pushUndo();
    const [x, y] = svgPt(e), p = T.frames[cur].p, i = drag.i;
    p[2*i] = clampX(x + drag.dx); p[2*i+1] = clampY(y + drag.dy);
    pieceEls[i].setAttribute('transform', `translate(${f2(p[2*i])},${f2(p[2*i+1])})`);
    drag.moved = true;
  } else if (bdrag && e.pointerId === bdrag.id) {
    const [x, y] = svgPt(e);
    if (!bdrag.moved && Math.hypot(x - bdrag.sx, y - bdrag.sy) < 0.4) return;
    if (bdrag.part === 'new') return;
    if (!bdrag.moved) pushUndo();
    bdrag.moved = true;
    const b = T.frames[cur].b[bdrag.k], o = bdrag.o;
    let dx = x - bdrag.sx, dy = y - bdrag.sy;
    if (bdrag.part === 'pt') { b.x = clampX(o.x + dx); b.y = clampY(o.y + dy); }
    else {
      // 本体とポイントを形を保ったまま一緒に動かす(どちらもコートの外へ出ない範囲で)
      dx = Math.max(Math.max(-0.8 - o.x, -1 - o.bx), Math.min(Math.min(20.8 - o.x, 21 - o.bx), dx));
      dy = Math.max(Math.max(-1 - o.y, -1.2 - o.by), Math.min(Math.min(41 - o.y, 41.2 - o.by), dy));
      b.x = o.x + dx; b.y = o.y + dy; b.bx = o.bx + dx; b.by = o.by + dy;
    }
    renderBubbles();
  } else if (draw && e.pointerId === draw.id) {
    const [x, y] = svgPt(e), q = [clampX(x), clampY(y)];
    if (dist(q, draw.pts[draw.pts.length-1]) < 0.25) return;
    draw.pts.push(q);
    if (draw.g) draw.g.remove();
    if (pathLen(draw.pts) >= 0.8) draw.g = drawArrow({t: mode, pts: draw.pts}, gArrows, null);
  }
});
function pathLen(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += dist(pts[i-1], pts[i]); return s; }
function simplify(pts) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) if (dist(pts[i], out[out.length-1]) >= 0.5) out.push(pts[i]);
  out.push(pts[pts.length-1]);
  if (out.length <= 40) return out;
  const res = [];
  for (let i = 0; i < 40; i++) res.push(out[Math.round(i * (out.length - 1) / 39)]);

}
function endPointer(e, commit) {
  if (drag && e.pointerId === drag.id) {
    if (drag.moved) markDirty();
    drag = null;
  } else if (bdrag && e.pointerId === bdrag.id) {
    const d = bdrag; bdrag = null;
    if (d.moved) { markDirty(); return; }
    if (!commit) return;
    if (d.part === 'new') { const [x, y] = svgPt(e); addBubble(clampX(x), clampY(y)); }
    else editBubble(d.k);
  } else if (draw && e.pointerId === draw.id) {
    const d = draw; draw = null;
    if (d.g) d.g.remove();
    if (!commit) return;
    if (pathLen(d.pts) < 0.8) {
      if (d.hit != null) { pushUndo(); T.frames[cur].a.splice(d.hit, 1); renderArrows(); markDirty(); }
      return;
    }
    pushUndo();
    T.frames[cur].a.push({t: mode, pts: simplify(d.pts)});
    renderArrows();
    markDirty();
  }
}
svg.addEventListener('pointerup', e => endPointer(e, true));
svg.addEventListener('pointercancel', e => endPointer(e, false));

// ---------- 再生 ----------
let raf = null;
const ease = k => k * k * (3 - 2 * k);
function play() {
  if (T.frames.length < 2) { toast('コマを2つ以上作ると再生できます'); return; }
  playing = true;
  $('playBtn').textContent = '❚❚ 停止';
  $('memo').readOnly = true;
  select(cur >= T.frames.length - 1 ? 0 : cur);
  let t0 = performance.now();
  const tick = now => {
    if (!playing) return;
    const D = SPEEDS[speed].ms, H = D * 0.5, el = now - t0;
    if (el < H) {
      // コマで一旦止める
    } else if (cur < T.frames.length - 1 && el < H + D) {
      setPos(framePos(cur, ease((el - H) / D)));
    } else if (cur < T.frames.length - 1) {
      select(cur + 1);
      t0 = now;
    } else {
      stop();
      return;
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function stop() {
  if (!playing) return;
  playing = false;
  cancelAnimationFrame(raf);
  $('playBtn').textContent = '▶ 再生';
  $('memo').readOnly = false;
  setPos(T.frames[cur].p);
  renderArrows();
}

// ---------- 保存形式 ----------
const r10 = v => Math.round(v * 10);
function pack(t) {
  return {v: 1, n: t.name, ...(t.hideRun ? {h: 1} : {}), f: t.frames.map(f => {
    const o = {p: f.p.map(r10)};
    if (f.a.length) o.a = f.a.map(a => [TYPES.indexOf(a.t), ...a.pts.flatMap(q => [r10(q[0]), r10(q[1])])]);
    if (f.b && f.b.length) o.b = f.b.map(b => [r10(b.x), r10(b.y), r10(b.bx), r10(b.by), b.t]);
    if (f.m) o.m = f.m;
    return o;
  })};
}
function num(v, lo, hi, def) { v = Number(v) / 10; return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def; }
function unpack(o) {
  if (!o || !Array.isArray(o.f) || !o.f.length) throw new Error('bad data');
  const def = defaultPos();
  return {
    id: null,
    name: String(o.n || '作戦').slice(0, 60),
    hideRun: o.h === 1,
    frames: o.f.slice(0, 200).map(f => {
      const src = Array.isArray(f.p) && f.p.length === 22 ? f.p : def.map(r10);
      const p = src.map((v, i) => i % 2 ? num(v, -1, 41, def[i]) : num(v, -0.8, 20.8, def[i]));
      const a = (Array.isArray(f.a) ? f.a : []).slice(0, 50).map(x => {
        if (!Array.isArray(x) || x.length < 5) return null;
        const pts = [];
        for (let i = 1; i + 1 < x.length && pts.length < 40; i += 2) pts.push([num(x[i], -0.8, 20.8, 10), num(x[i+1], -1, 41, 20)]);
        return {t: TYPES[x[0]] || 'run', pts};
      }).filter(Boolean);
      const b = (Array.isArray(f.b) ? f.b : []).slice(0, 20).map(x => Array.isArray(x) && x.length >= 5 ? {
        x: num(x[0], -0.8, 20.8, 10), y: num(x[1], -1, 41, 20),
        bx: num(x[2], -1, 21, 10), by: num(x[3], -1.2, 41.2, 20), t: String(x[4]).slice(0, 30)
      } : null).filter(x => x && x.t);
      return {p, a, b, m: String(f.m || '').slice(0, 200)};
    })
  };
}

// ---------- 端末内の保存 ----------
function readSaved() {
  try { const v = JSON.parse(localStorage.getItem(KEY_SAVED)); return Array.isArray(v) ? v : []; }
  catch { return []; }
}
function writeSaved(list) {
  try { localStorage.setItem(KEY_SAVED, JSON.stringify(list)); return true; }
  catch { toast('保存できませんでした(ブラウザの保存領域が使えません)'); return false; }
}
function saveDraft() {
  try { localStorage.setItem(KEY_DRAFT, JSON.stringify({id: T.id, dirty, d: pack(T)})); } catch {}
}
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function saveCurrent() {
  const list = readSaved();
  if (!T.id) T.id = newId();
  const entry = {id: T.id, name: T.name, updated: Date.now(), d: pack(T)};
  const i = list.findIndex(x => x.id === T.id);
  if (i >= 0) list[i] = entry; else list.unshift(entry);
  if (!writeSaved(list)) return;
  dirty = false;
  updateSaveBtn();
  saveDraft();
  toast('「' + T.name + '」を保存しました');
}
$('saveBtn').onclick = () => { stop(); saveCurrent(); };

async function confirmDiscard() {
  return !dirty || await ask('今の作戦は保存されていません。保存せずに切り替えますか？', '切り替える', true);
}
function openTactic(t, id, isDirty) {
  stop();
  T = t; T.id = id; cur = 0; dirty = isDirty;
  resetUndo();
  renderAll();
  saveDraft();
  scheduleShare();
}
function renderList() {
  const box = $('list');
  box.textContent = '';
  const list = readSaved();
  if (!list.length) {
    const p = document.createElement('div');
    p.className = 'empty';
    p.textContent = 'まだ保存した作戦はありません。作戦を作って「保存」を押すと、ここに並びます。';
    box.appendChild(p);
    return;
  }
  for (const it of list) {
    const card = document.createElement('div');
    card.className = 'item';
    const n = document.createElement('div');
    n.className = 'name';
    n.textContent = it.name + (it.id === T.id ? '(表示中)' : '');
    const m = document.createElement('div');
    m.className = 'meta';
    const frames = it.d && Array.isArray(it.d.f) ? it.d.f.length : 0;
    m.textContent = 'コマ' + frames + ' ・ ' + new Date(it.updated).toLocaleString('ja-JP', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
    const row = document.createElement('div');
    row.className = 'row';
    const mk = (label, fn, cls) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; row.appendChild(b); };
    mk('開く', async () => {
      if (it.id !== T.id && !await confirmDiscard()) return;
      try { openTactic(unpack(it.d), it.id, false); } catch { toast('この作戦は開けませんでした'); return; }
      $('sheet').hidden = true;
    }, 'grow');
    mk('複製', () => {
      const l = readSaved();
      l.unshift({id: newId(), name: it.name + ' のコピー', updated: Date.now(), d: it.d});
      if (writeSaved(l)) { renderList(); toast('複製しました'); }
    });
    mk('削除', async () => {
      if (!await ask('「' + it.name + '」を削除しますか？', '削除する', true)) return;
      writeSaved(readSaved().filter(x => x.id !== it.id));
      if (T.id === it.id) { T.id = null; markDirty(); }
      renderList();
    }, 'danger');
    card.append(n, m, row);
    box.appendChild(card);
  }
}
$('listBtn').onclick = () => { stop(); renderList(); $('sheet').hidden = false; };
$('closeBtn').onclick = () => { $('sheet').hidden = true; };
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').hidden = true; });
$('newBtn').onclick = async () => {
  if (!await confirmDiscard()) return;
  openTactic(newTactic(), null, false);
  $('sheet').hidden = true;
  toast('新しい作戦を作りました');
};

// ---------- 共有リンク ----------
function b64u(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64u(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function pipe(u, stream) {
  return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(stream)).arrayBuffer());
}
const jsonBytes = t => new TextEncoder().encode(JSON.stringify(pack(t)));
async function encode(t) {
  if ('CompressionStream' in window) {
    try { return 'z' + b64u(await pipe(jsonBytes(t), new CompressionStream('deflate-raw'))); } catch {}
  }
  return 'j' + b64u(jsonBytes(t));
}
async function decode(s) {
  const u = unb64u(s.slice(1));
  const bytes = s[0] === 'z' ? await pipe(u, new DecompressionStream('deflate-raw')) : u;
  return unpack(JSON.parse(new TextDecoder().decode(bytes)));
}
const baseUrl = () => location.href.split('#')[0];
let shareTimer = null;
function scheduleShare() {
  shareUrl = null;
  clearTimeout(shareTimer);
  shareTimer = setTimeout(async () => {
    const snap = T, code = await encode(T);
    if (snap === T) shareUrl = baseUrl() + '#t=' + code;
  }, 300);
}
function copyLink(url) {
  const fallback = () => showLink(url);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(() => toast('共有リンクをコピーしました。LINEなどに貼り付けて送れます'), fallback);
  } else fallback();
}
$('shareBtn').onclick = () => {
  stop();
  const url = shareUrl || baseUrl() + '#t=' + 'j' + b64u(jsonBytes(T));
  if (navigator.share && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    navigator.share({title: T.name, text: 'フットサル作戦「' + T.name + '」', url})
      .catch(err => { if (err.name !== 'AbortError') copyLink(url); });
  } else copyLink(url);
};

async function loadFromHash() {
  const h = location.hash.match(/^#t=([A-Za-z0-9_-]+)$/);
  if (!h) return false;
  history.replaceState(null, '', baseUrl());
  let t;
  try { t = await decode(h[1]); }
  catch { toast('共有リンクを読み込めませんでした'); return false; }
  if (dirty) {
    // 保存していない作業は、消さずに一覧へ退避する
    const list = readSaved();
    list.unshift({id: newId(), name: T.name + '(未保存の作業)', updated: Date.now(), d: pack(T)});
    writeSaved(list);
  }
  openTactic(t, null, true);
  toast('共有された作戦「' + t.name + '」を読み込みました');
  setTimeout(play, 700);
  return true;
}
window.addEventListener('hashchange', loadFromHash);

// ---------- 起動 ----------
(async () => {
  try {
    const d = JSON.parse(localStorage.getItem(KEY_DRAFT));
    if (d && d.d) { T = unpack(d.d); T.id = d.id || null; dirty = !!d.dirty; }
  } catch {}
  renderAll();
  scheduleShare();
  await loadFromHash();
})();
</script>
